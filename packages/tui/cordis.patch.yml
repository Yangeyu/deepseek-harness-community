# yaml-language-server: $schema=none
# The base bundle is installed automatically for a new profile. This patch
# selects community capability providers and adds the TUI-specific host plane.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

- id: tools
  config:
    # yaml-language-server-disable Unresolved tag
    mode: !!js process.env.DSH_TOOLS_MODE

# Keep the official search/fetch tool contract while delegating search policy
# to one live settings-backed adapter. Safe HTTP fetching stays upstream-owned.
- id: web
  config:
    searchProvider: community-web
    fetchProvider: http

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # One Host-owned namespace for @file discovery and the matching model
    # guidance. The TUI consumes ctx.fileReferences and owns no path index.
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    # Provider connection and served model capabilities are explicit here;
    # agent-default-model independently selects one registered model.
    - id: llm-bailian
      name: '@vascent/deepseek-harness-tui/bailian'
      config:
        baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
        models:
          deepseek-v4-pro-0813:
            contextWindow: 1000000
            maxOutputTokens: 393216
            maxTokensField: max_tokens
            input:
              - text
            reasoning:
              defaultEffort: high
              efforts:
                off:
                  enableThinking: false
                low:
                  enableThinking: true
                  reasoningEffort: low
                high:
                  enableThinking: true
                  reasoningEffort: high
                max:
                  enableThinking: true
                  reasoningEffort: max
          qwen3.7-plus:
            name: Qwen3.7 Plus
            contextWindow: 1000000
            maxOutputTokens: 131072
            maxTokensField: max_completion_tokens
            input:
              - text
              - image
            reasoning:
              defaultEffort: high
              efforts:
                off:
                  enableThinking: false
                high:
                  enableThinking: true

    - id: memory
      name: '@vascent/deepseek-harness-tui/memory'
      config:
        # yaml-language-server-disable Unresolved tag
        root: !!js dshHomePath('memories')
        useMemories: true
        generateMemories: true
        idleDelayMs: 1500
        maxContextBytes: 25600
        maxDocumentBytes: 262144
        maxSummaryChars: 600
        maxDetailsChars: 4000
        extractionMaxInputBytes: 32768
        minCandidateChars: 6

    - id: vision
      name: '@vascent/deepseek-harness-tui/vision'
      config:
        mode: auto
        proxyProvider: bailian
        proxyModel: qwen3.7-plus

    - id: community-web
      name: '@vascent/deepseek-harness-tui/web'
      config:
        searchProvider: auto
        extractProvider: community-tavily
        extractMaxOutputChars: 60000
        tavilyApiKeyEnv: TAVILY_API_KEY
        tavilySearchDepth: basic
        tavilyExtractDepth: basic
        tavilyTimeoutSeconds: 30

    # Web's composer statistics read this whole-log projection. Keep the TUI
    # on the same counts and timing source instead of folding its history page.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    # The v0.1.2 Session Controller is the in-process Host boundary. The TUI
    # adapts it to consumer-owned ports; browser Connection/Remote state is not
    # duplicated inside this terminal process.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: terminal
      name: '@vascent/deepseek-harness-tui'
      config:
        historyMessages: 200
        rewindHistory: 20
        showReasoning: true
        thinkingMaxLines: 8
        color: true
