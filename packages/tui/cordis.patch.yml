# The base bundle is installed automatically for a new profile. This patch
# selects community capability providers and adds the TUI-specific host plane.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
      Tokens written as @path or @"path with spaces" are explicit file or directory references relative to that working directory;
      inspect the referenced paths with workspace tools before answering and never infer their contents from the path alone.
      For referenced PNG, JPEG, WebP, or GIF files, use read_image when the active model accepts image input;
      otherwise use inspect_image to obtain text-only visual evidence through the configured Vision proxy.

- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# Keep the official search capability and model-tool contract while selecting
# the community search implementation explicitly. Page extraction remains a
# separate capability because Tavily does not expose origin HTTP response data.
- id: web
  config:
    searchProvider: community-brave

- id: tool-web
  config:
    fetch: false
    searchTimeoutMs: 30000

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: memory
      name: '@vascent/deepseek-harness-tui/memory'
      config:
        root: !!js dshHomePath('memories')
        useMemories: true
        generateMemories: true
        idleDelayMs: 1500
        maxContextBytes: 25600
        maxDocumentBytes: 262144
        maxSummaryChars: 600
        maxDetailsChars: 4000
        extractionMaxInputBytes: 32768
        minCandidateChars: 6

    - id: vision
      name: '@vascent/deepseek-harness-tui/vision'
      config:
        mode: auto
        proxyProvider: dashscope-vision
        proxyModel: qwen3.7-plus

    - id: community-web
      name: '@vascent/deepseek-harness-tui/web'
      config:
        braveApiKeyEnv: BRAVE_API_KEY
        extractProvider: community-tavily
        extractMaxOutputChars: 60000
        tavilyApiKeyEnv: TAVILY_API_KEY
        tavilyExtractDepth: basic
        tavilyTimeoutSeconds: 30

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # Web's composer statistics read this whole-log projection. Keep the TUI
    # on the same counts and timing source instead of folding its history page.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: terminal
      name: '@vascent/deepseek-harness-tui'
      config:
        historyMessages: 200
        rewindHistory: 20
        showReasoning: true
        thinkingMaxLines: 8
        color: true
        keymap: standard
