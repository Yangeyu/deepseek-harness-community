packages:
  - packages/*

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  koffi: true
  node-pty: true
  protobufjs: false

linkWorkspacePackages: true

strictPeerDependencies: true

# DeepSeek publishes one coordinated RC train. The lockfile and release
# contract enforce the selected exact version; this scope exception only lets
# an intentional runtime update resolve before the general maturity window.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-tui@0.84.2'
  - '@deepseek-ai/*'
