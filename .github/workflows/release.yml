name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: mkdir dist
      - run: pnpm pack --pack-destination dist
      - run: pnpm --dir packages/memory pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - run: pnpm --dir packages/tui pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
