name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package version
        run: |
          package_version=$(node --print "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${package_version}"
      - run: pnpm run release:check -- --artifacts-dir artifacts
      - name: Publish the installable package to npm
        shell: bash
        run: |
          package_name=$(node --print "require('./package.json').name")
          package_version=$(node --print "require('./package.json').version")
          archive_name="${package_name#@}"
          archive_name="${archive_name//\//-}-${package_version}.tgz"
          if pnpm exec npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published"
          else
            pnpm exec npm publish "./artifacts/${archive_name}" --access public
          fi
      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.tgz --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
