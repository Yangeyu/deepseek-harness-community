name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.15.0
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package version
        run: test "$GITHUB_REF_NAME" = "v$(node --print \"require('./package.json').version\")"
      - run: pnpm run check
      - run: mkdir dist
      - run: pnpm pack --pack-destination dist
      - run: pnpm --dir packages/memory pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - run: pnpm --dir packages/tui pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - name: Publish new package versions to npm
        shell: bash
        run: |
          publish_if_missing() {
            local directory="$1"
            local package_name package_version archive_name
            package_name=$(node --print "require('./${directory}/package.json').name")
            package_version=$(node --print "require('./${directory}/package.json').version")
            archive_name="${package_name#@}"
            archive_name="${archive_name//\//-}-${package_version}.tgz"
            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published"
              return
            fi
            npm publish "./dist/${archive_name}" --access public
          }

          publish_if_missing packages/memory
          publish_if_missing packages/tui
          publish_if_missing .
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
